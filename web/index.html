<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Sets the saved theme before first paint (no flash). Key: THEME_STORAGE_KEY in src/features/theme/theme.ts.
      try {
        var t = localStorage.getItem('hfc-theme')
        if (t === 'light' || t === 'dark') document.documentElement.classList.add(t)
      } catch (e) {}
    </script>
    <title>Emberline: Harmonized Fire Calendar, California region</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
