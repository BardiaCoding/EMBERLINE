[project]
name = "hotspots"
version = "0.1.0"
description = "Harmonized Fire Calendar for the California region (NASA Space Apps 2026, MODIS and VIIRS Hot Spots)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "shapely",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "huggingface_hub",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "pytest-socket",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotspots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests need no network. Loopback and Unix sockets (asyncio, TestClient) stay allowed.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
markers = [
    "delivered: reads the real delivered Parquet files; skipped when outputs2.0/ is absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["outputs2.0", "web", ".venv", ".kiro"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
